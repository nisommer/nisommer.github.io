<section id="analytics-consent" class="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <h2 id="analytics-consent-title">Audience measurement</h2>
  <p>May I use Google Analytics to understand which pages visitors read? It uses cookies and sends usage information to Google only after you accept. Advertising features are disabled. Refusing does not affect your access to this site.</p>
  <p><a href="/privacy/">Privacy and analytics details</a></p>
  <div class="analytics-consent-actions">
    <button type="button" id="analytics-accept">Accept</button>
    <button type="button" id="analytics-refuse">Refuse</button>
  </div>
</section>
<footer class="analytics-preferences">
  <a href="/privacy/">Privacy</a>
  <button type="button" id="analytics-settings" aria-controls="analytics-consent" aria-expanded="false" hidden>Analytics preferences</button>
  <span id="analytics-status" role="status" aria-live="polite"></span>
</footer>
<script id="analytics-consent-script" src="/public/js/analytics-consent.js" data-measurement-id="{{ site.ga4_measurement_id | escape }}" defer></script>
